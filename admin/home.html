<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iProject</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=Prompt:wght@300;400;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary-blue: #1e40af;
            --accent-pink: #f472b6;
            --text-dark: #0f172a;
            --text-gray: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Prompt', sans-serif;
            background-color: #ffffff;
            color: var(--text-dark);
            overflow-x: hidden;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 80px;
            background-color: white;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-dark);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 600;
            font-size: 14px;
        }

        .nav-links a:hover {
            color: var(--primary-blue);
        }

        /* Hero Section */
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 80px;
            height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
        }

        .hero-content {
            flex: 1;
            max-width: 650px;
        }

        .hero-content h1 {
            font-size: 80px;
            line-height: 0.95;
            font-weight: 800;
            margin-bottom: 25px;
            letter-spacing: -3px;
        }

        .hero-content p {
            font-size: 22px;
            color: var(--text-gray);
            margin-bottom: 45px;
            font-family: 'Prompt', sans-serif;
            font-weight: 300;
        }

        .btn-main-new {
            background-color: var(--text-dark);
            color: white;
            text-decoration: none;
            padding: 20px 45px;
            border-radius: 50px;
            font-size: 20px;
            font-weight: 700;
            display: inline-block;
            transition: transform 0.3s, background-color 0.3s;
        }

        .btn-main-new:hover {
            background-color: var(--primary-blue);
            transform: translateY(-3px);
        }

        /* Hero Image/Illustration */
        .hero-visual {
            flex: 1;
            display: flex;
            justify-content: flex-end;
            position: relative;
        }

        .globe-container {
            width: 500px;
            height: 500px;
            position: relative;
        }

        /* จำลองรูปโลกและวงโคจรด้วย CSS */
        .globe-bg {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 30%, #3b82f6, #1e40af);
            border-radius: 50%;
            box-shadow: inset -20px -20px 50px rgba(0, 0, 0, 0.3), 0 0 80px rgba(59, 130, 246, 0.3);
        }

        .orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120%;
            height: 40%;
            border: 2px solid var(--accent-pink);
            border-radius: 50%;
            transform: translate(-50%, -50%) rotate(-25deg);
            opacity: 0.6;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            nav {
                padding: 20px 40px;
            }

            .hero {
                flex-direction: column;
                text-align: center;
                padding-top: 150px;
            }

            .hero-content h1 {
                font-size: 60px;
            }

            .hero-visual {
                justify-content: center;
                margin-top: 50px;
            }

            .globe-container {
                width: 350px;
                height: 350px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="/admin/home.html" class="logo">iProject <span style="color:var(--primary-blue)">Admin</span></a>

        <div class="nav-links">
            <a href="/admin/admin_dashboard.html">Dashboard</a>
            <a href="/login/login.html">Login</a>
        </div>
    </nav>

    <main class="hero">
        <div class="hero-content">
            <h1>Vision to Reality<br>Driven by Clarity</h1>
            <p>Bring projects to life with a clear management system.</p>
            <a href="/admin/admin_dashboard.html" class="btn-main-new"> <i class=""></i>Admin Dashboard</a>
        </div>

        <div class="hero-visual">
            <div class="globe-container">
                <div class="globe-bg"></div>
                <div class="orbit"></div>
            </div>
        </div>
    </main>

</body>

</html>
